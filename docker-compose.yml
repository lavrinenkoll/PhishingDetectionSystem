services:
  db:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${PGADMIN_PORT:-5050}/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  history-service:
    build: ./services/history_service
    container_name: history_service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${HISTORY_DATABASE_URL}
      - APP_HOST=${HISTORY_SERVICE_HOST}
      - APP_PORT=${HISTORY_SERVICE_PORT}
    ports:
      - "${HISTORY_SERVICE_PORT}:${HISTORY_SERVICE_PORT}"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${HISTORY_SERVICE_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  threat-intel:
    build: ./services/threat_intel
    container_name: "${THREAT_INTEL_CONTAINER_NAME}"
    ports:
      - "${THREAT_INTEL_PORT}:${THREAT_INTEL_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${THREAT_INTEL_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  domain-analyzer:
    build: ./services/domain_analyzer
    container_name: "${DOMAIN_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${DOMAIN_ANALYZER_PORT}:${DOMAIN_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${DOMAIN_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  content-analyzer:
    build: ./services/content_analyzer
    container_name: "${CONTENT_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${CONTENT_ANALYZER_PORT}:${CONTENT_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${CONTENT_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 4
    mem_limit: 6G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=1g
      - /home/seluser/.cache:rw,size=128m
      - /dev/shm:rw,size=2g

  behavior-analyzer:
    build: ./services/behavior_analyzer
    container_name: "${BEHAVIOR_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${BEHAVIOR_ANALYZER_PORT}:${BEHAVIOR_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${BEHAVIOR_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 6
    mem_limit: 6G
    shm_size: "4g"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=3g
      - /dev/shm:rw,size=6g
    depends_on:
      - content-analyzer

  risk-aggregator:
    build: ./services/risk_aggregator
    container_name: "${RISK_AGGREGATOR_CONTAINER_NAME}"
    ports:
      - "${RISK_AGGREGATOR_PORT}:${RISK_AGGREGATOR_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${RISK_AGGREGATOR_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - threat-intel
      - domain-analyzer
      - content-analyzer
      - behavior-analyzer
      - history-service
      - db

  ui-service:
    build: ./services/ui_service
    container_name: "${UI_SERVICE_CONTAINER_NAME}"
    env_file:
      - .env
    environment:
      - UI_SERVICE_HOST=${UI_SERVICE_HOST}
      - UI_SERVICE_PORT=${UI_SERVICE_PORT}
    ports:
      - "${UI_SERVICE_PORT}:${UI_SERVICE_PORT}"
    restart: unless-stopped
    depends_on:
      - risk-aggregator
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${UI_SERVICE_PORT}/_stcore/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
