services:
  db:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  history_service:
    build: ./services/history_service
    container_name: history_service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${HISTORY_DATABASE_URL}
      - APP_HOST=${HISTORY_APP_HOST}
      - APP_PORT=${HISTORY_APP_PORT}
    ports:
      - "${HISTORY_APP_PORT}:${HISTORY_APP_PORT}"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://${HISTORY_APP_HOST}:${HISTORY_APP_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  threat-intel:
    build: ./services/threat_intel
    container_name: "${THREAT_INTEL_CONTAINER_NAME}"
    ports:
      - "${THREAT_INTEL_PORT}:${THREAT_INTEL_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${THREAT_INTEL_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  domain-analyzer:
    build: ./services/domain_analyzer
    container_name: "${DOMAIN_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${DOMAIN_ANALYZER_PORT}:${DOMAIN_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${DOMAIN_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  content-analyzer:
    build: ./services/content_analyzer
    container_name: "${CONTENT_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${CONTENT_ANALYZER_PORT}:${CONTENT_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${CONTENT_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 0.5
    mem_limit: 512M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=100m
      - /home/seluser/.cache:rw,size=50m
      - /dev/shm:rw,size=256m

  behavior-analyzer:
    build: ./services/behavior_analyzer
    container_name: "${BEHAVIOR_ANALYZER_CONTAINER_NAME}"
    ports:
      - "${BEHAVIOR_ANALYZER_PORT}:${BEHAVIOR_ANALYZER_PORT}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${BEHAVIOR_ANALYZER_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 6
    mem_limit: 6G
    shm_size: "4g"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=3g
      - /dev/shm:rw,size=6g
    depends_on:
      - content-analyzer

volumes:
  pgdata:
